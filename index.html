<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flipr</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f0eee9;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 0;
  }

  #root {
    width: 390px;
    min-height: 100vh;
    background: #fafafa;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  @keyframes flipr-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #6b6b6b;
  }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const API_BASE = "https://bvl98eh3bf.execute-api.us-east-1.amazonaws.com/dev";

/* ─── Clipboard helper — navigator.clipboard requires HTTPS, so fall back
   to the legacy execCommand trick when running on plain HTTP (e.g. S3
   static website hosting has no TLS by default) ─── */
function copyToClipboard(text) {
  if (window.isSecureContext && navigator.clipboard) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try {
      const el = document.createElement('textarea');
      el.value = text;
      el.style.position = 'fixed';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.focus();
      el.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(el);
      ok ? resolve() : reject(new Error('copy failed'));
    } catch (err) {
      reject(err);
    }
  });
}

/* ─── Small per-field copy button ─── */
function CopyField({ value, small }) {
  const [done, setDone] = useState(false);
  if (!value) return null;
  return (
    <button
      onClick={(e) => {
        e.stopPropagation();
        copyToClipboard(String(value)).catch(() => {});
        setDone(true);
        setTimeout(() => setDone(false), 1200);
      }}
      title="Copy this field"
      style={{
        border: 'none', background: 'none', cursor: 'pointer', padding: 2,
        display: 'inline-flex', alignItems: 'center', marginLeft: 6,
        color: done ? '#4f6ef7' : '#9a9a9a', flexShrink: 0,
      }}
    >
      {done ? (
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
      ) : (
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M3 10.5V3.5C3 2.67157 3.67157 2 4.5 2H10.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
      )}
    </button>
  );
}

/* ─── Shared top bar ─── */
function TopBar() {
  return (
    <div style={{ paddingTop: 56, paddingLeft: 20, paddingRight: 20, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
      <span style={{ fontSize: 20, fontWeight: 700, color: '#1a1a1a', letterSpacing: '-0.4px' }}>
        Flipr<span style={{ color: '#4f6ef7' }}>.</span>
      </span>
      <div style={{
        width: 32, height: 32, borderRadius: '50%', background: '#e7e7e7',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: '#6b6b6b', letterSpacing: '0.4px'
      }}>JD</div>
    </div>
  );
}

/* ─── Hatched placeholder box ─── */
function HatchBox({ size, label }) {
  const id = `hatch-${size}-${label}`;
  return (
    <svg width={size} height={size} style={{ borderRadius: 8, flexShrink: 0 }}>
      <defs>
        <pattern id={id} patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#c9c9c9" strokeWidth="1" strokeDasharray="3 3" />
        </pattern>
      </defs>
      <rect width={size} height={size} fill={`url(#${id})`} rx="8" />
      {label && (
        <text x={size/2} y={size/2 + 3} textAnchor="middle" fontFamily="JetBrains Mono, monospace" fontSize="9" fill="#9a9a9a" letterSpacing="0.5">{label}</text>
      )}
    </svg>
  );
}

/* ══════════════════════════════════════════
   SCREEN 1: UPLOAD
══════════════════════════════════════════ */
function UploadScreen({ onAnalyze }) {
  const [files, setFiles] = useState([]);
  const [previews, setPreviews] = useState([]);
  const inputRef = useRef(null);

  useEffect(() => {
    return () => previews.forEach(url => URL.revokeObjectURL(url));
  }, []);

  function handleFileChange(e) {
    const incoming = Array.from(e.target.files);
    const newUrls = incoming.map(f => URL.createObjectURL(f));
    setFiles(prev => [...prev, ...incoming].slice(0, 5));
    setPreviews(prev => [...prev, ...newUrls].slice(0, 5));
    e.target.value = '';
  }

  function removeFile(i) {
    URL.revokeObjectURL(previews[i]);
    setFiles(prev => prev.filter((_, idx) => idx !== i));
    setPreviews(prev => prev.filter((_, idx) => idx !== i));
  }

  const hasFiles = files.length > 0;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
      <TopBar />
      <input
        ref={inputRef}
        type="file"
        multiple
        accept="image/*"
        style={{ display: 'none' }}
        onChange={handleFileChange}
      />

      {/* Title */}
      <div style={{ padding: '12px 20px 20px' }}>
        <div style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.6px', color: '#1a1a1a' }}>New batch</div>
        <div style={{ fontSize: 14, color: '#6b6b6b', marginTop: 6 }}>Add up to 5 photos. We'll handle the rest.</div>
      </div>

      {/* Upload zone */}
      <div style={{ margin: '0 20px' }}>
        <div
          onClick={!hasFiles ? () => inputRef.current.click() : undefined}
          style={hasFiles ? {
            width: '100%',
            borderRadius: 14,
            border: 'none',
            background: '#ffffff',
            cursor: 'default',
          } : {
            position: 'relative',
            width: '100%',
            paddingTop: '100%',
            borderRadius: 14,
            border: '1.5px dashed #c9c9c9',
            background: 'repeating-linear-gradient(135deg, transparent 0 10px, rgba(0,0,0,0.02) 10px 11px)',
            cursor: 'pointer',
            overflow: 'hidden',
          }}
        >
          <div style={hasFiles ? {} : { position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
            {!hasFiles ? (
              <>
                <div style={{
                  width: 52, height: 52, borderRadius: '50%', background: '#ffffff',
                  border: '1px solid #e7e7e7', display: 'flex', alignItems: 'center', justifyContent: 'center'
                }}>
                  <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                    <path d="M11 14V4M11 4L7 8M11 4L15 8" stroke="#1a1a1a" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M4 16v1a2 2 0 002 2h10a2 2 0 002-2v-1" stroke="#6b6b6b" strokeWidth="1.6" strokeLinecap="round"/>
                  </svg>
                </div>
                <div style={{ fontSize: 15, fontWeight: 500, color: '#1a1a1a', marginTop: 14 }}>Tap to upload photo</div>
                <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: '#9a9a9a', marginTop: 4 }}>JPG · PNG · HEIC</div>
              </>
            ) : (
              <div style={{
                width: '100%',
                display: 'grid',
                gridTemplateColumns: '1fr 1fr',
                gap: 8,
                padding: 12,
              }}>
                {previews.map((url, i) => (
                  <div key={i} style={{
                    position: 'relative',
                    borderRadius: 10,
                    paddingTop: '100%',
                    overflow: 'hidden',
                  }}>
                    <img src={url} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} alt="" />
                    <button
                      onClick={e => { e.stopPropagation(); removeFile(i); }}
                      style={{
                        position: 'absolute', top: 5, right: 5,
                        width: 20, height: 20, borderRadius: '50%',
                        background: 'rgba(0,0,0,0.6)', border: 'none',
                        color: '#fff', fontSize: 13, lineHeight: 1,
                        cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontFamily: 'Inter, sans-serif',
                      }}
                    >×</button>
                  </div>
                ))}
                {files.length < 5 && (
                  <div
                    onClick={() => inputRef.current.click()}
                    style={{
                      position: 'relative',
                      paddingTop: '100%',
                      background: '#f5f5f5',
                      border: '1.5px dashed #c9c9c9',
                      borderRadius: 10,
                      cursor: 'pointer',
                    }}
                  >
                    <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 4 }}>
                      <span style={{ fontSize: 22, color: '#9a9a9a', lineHeight: 1 }}>+</span>
                      <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 10, color: '#9a9a9a' }}>add</span>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Counter */}
      {hasFiles && (
        <div style={{ marginTop: 12, marginLeft: 20, marginRight: 20 }}>
          <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: '#9a9a9a' }}>
            {files.length} of 5 photos added
          </span>
        </div>
      )}

      <div style={{ flex: 1 }} />

      {/* Bottom dock */}
      <div style={{ padding: '12px 20px 48px', borderTop: '1px solid #f0f0f0' }}>
        <button
          onClick={() => hasFiles && onAnalyze(files)}
          disabled={!hasFiles}
          style={{
            width: '100%', height: 52, borderRadius: 12, border: 'none',
            background: hasFiles ? '#1a1a1a' : '#ececec',
            color: hasFiles ? '#ffffff' : '#9a9a9a',
            fontSize: 15, fontWeight: 600, cursor: hasFiles ? 'pointer' : 'not-allowed',
            fontFamily: 'Inter, sans-serif', letterSpacing: '-0.2px',
            transition: 'background 0.2s, color 0.2s',
          }}
        >
          Analyze Items →
        </button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   SCREEN 2: PROCESSING
══════════════════════════════════════════ */
function ProcessingScreen({ files, onDone }) {
  const [phase, setPhase] = useState('uploading'); // 'uploading' | 'analyzing'
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;

    // Poll a single Lambda job (POST /jobs -> upload -> GET /jobs/{id}) until complete/failed
    async function runOneJob(file) {
      const createRes = await fetch(`${API_BASE}/jobs`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ marketplace: 'ebay' }),
      });
      if (!createRes.ok) throw new Error(`create job ${createRes.status}: ${await createRes.text()}`);
      const { job_id, upload_url } = await createRes.json();

      const uploadRes = await fetch(upload_url, {
        method: 'PUT',
        headers: { 'Content-Type': file.type || 'image/jpeg' },
        body: file,
      });
      if (!uploadRes.ok) throw new Error(`upload ${uploadRes.status}`);

      while (!cancelled) {
        await new Promise(r => setTimeout(r, 2000));
        if (cancelled) return null;
        const statusRes = await fetch(`${API_BASE}/jobs/${job_id}`);
        if (!statusRes.ok) throw new Error(`jobs ${statusRes.status}`);
        const data = await statusRes.json();
        if (data.status === 'complete') return { job_id, ...data };
        if (data.status === 'failed') throw new Error(data.error || 'Job failed');
      }
      return null;
    }

    async function run() {
      try {
        // Lambda's /jobs endpoint processes one image per job, so run each
        // uploaded photo as its own job, in parallel, then combine results.
        const results = await Promise.all(files.map(runOneJob));
        if (cancelled) return;
        setPhase('analyzing');
        if (cancelled) return;

        const combined = {
          status: 'completed',
          items: results.filter(Boolean).map(r => ({
            job_id: r.job_id,
            result: {
              metadata: r.metadata,
              comps: r.comps,
              listings: r.listings,
            },
          })),
        };
        onDone(results[0]?.job_id || '', combined);
      } catch (err) {
        if (!cancelled) setError(err.message);
      }
    }

    run();
    return () => { cancelled = true; };
  }, []);

  if (error) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
        <TopBar />
        <div style={{ padding: '12px 20px 20px' }}>
          <div style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.6px', color: '#1a1a1a' }}>Something went wrong</div>
          <div style={{ fontSize: 14, color: '#dc2626', marginTop: 6, fontFamily: 'JetBrains Mono, monospace' }}>{error}</div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
      <TopBar />
      <div style={{ padding: '12px 20px 20px' }}>
        <div style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.6px', color: '#1a1a1a' }}>
          {phase === 'uploading' ? 'Uploading photos…' : 'Analyzing your items…'}
        </div>
        <div style={{ fontSize: 14, color: '#6b6b6b', marginTop: 6 }}>Usually takes 10–20 seconds</div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 1, paddingBottom: 80 }}>
        <div style={{
          width: 40, height: 40, borderRadius: '50%',
          border: '3px solid #e7e7e7', borderTopColor: '#4f6ef7',
          animation: 'flipr-spin 0.8s linear infinite',
        }} />
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   SCREEN 3: RESULTS
══════════════════════════════════════════ */
function ResultsScreen({ jobId, jobData, previewUrls, onReset }) {
  const listings = jobData.items.map((item, index) => ({
    itemIndex: index,
    jobId: item.job_id,
    imageUrl: previewUrls[index],
    metadata: item.result.metadata,
    comps: item.result.comps,
    poshmark: item.result.listings.find(l => l.platform === "poshmark"),
    ebay: item.result.listings.find(l => l.platform === "ebay"),
  }));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
      <TopBar />

      <div style={{ padding: '12px 20px 20px' }}>
        <div style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.6px', color: '#1a1a1a' }}>{listings.length} listings ready</div>
        <div style={{ fontSize: 14, color: '#6b6b6b', marginTop: 6 }}>Tap copy to use a listing</div>
      </div>

      {/* Scrollable listing cards */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '0 20px 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
        {listings.map((listing) => (
          <ListingCard key={listing.itemIndex} listing={listing} jobId={listing.jobId} itemIndex={listing.itemIndex} />
        ))}
      </div>

      {/* Bottom dock */}
      <div style={{ padding: '12px 20px 48px', borderTop: '1px solid #f0f0f0', flexShrink: 0 }}>
        <button
          onClick={onReset}
          style={{
            width: '100%', height: 44, borderRadius: 10, border: '1px solid #d4d4d4',
            background: '#ffffff', color: '#1a1a1a',
            fontSize: 14, fontWeight: 500, cursor: 'pointer', fontFamily: 'Inter, sans-serif',
          }}
        >
          ← Start new batch
        </button>
      </div>
    </div>
  );
}

/* ─── Listing card sub-components ─── */
function FieldLabel({ children }) {
  return (
    <div style={{
      fontFamily: 'JetBrains Mono, monospace', fontSize: 11,
      textTransform: 'uppercase', letterSpacing: '0.8px',
      color: '#6b6b6b', marginBottom: 5,
    }}>{children}</div>
  );
}

function FieldRow({ label, value }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <FieldLabel>{label}</FieldLabel>
      <div style={{ fontSize: 14, fontWeight: 500, color: '#1a1a1a', display: 'flex', alignItems: 'center' }}>
        <span>{value}</span>
        <CopyField value={value} />
      </div>
    </div>
  );
}

/* ─── Pricing explainability ─── */
function PricingExplain({ comps, price }) {
  const [open, setOpen] = useState(false);
  if (!comps) return null;
  const sample = comps.sample_size;
  const median = comps.median_price;
  const low = comps.low_price;
  const high = comps.high_price;
  const rawComps = comps.raw_comps || [];

  return (
    <div style={{ marginBottom: 14, background: '#fafafa', border: '1px solid #f0f0f0', borderRadius: 8, padding: '10px 12px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <FieldLabel>Why this price</FieldLabel>
        {rawComps.length > 0 && (
          <button
            onClick={() => setOpen(o => !o)}
            style={{ background: 'none', border: 'none', color: '#4f6ef7', fontSize: 12, cursor: 'pointer', fontFamily: 'Inter, sans-serif', padding: 0 }}
          >{open ? 'Hide comps ↑' : `See ${Math.min(rawComps.length, 10)} comps →`}</button>
        )}
      </div>
      <div style={{ fontSize: 13, color: '#1a1a1a', lineHeight: 1.5, marginTop: 4 }}>
        {sample ? (
          <>Priced from <strong>{sample} sold {sample === 1 ? 'listing' : 'listings'}</strong> (range ${Number(low).toFixed(2)}–${Number(high).toFixed(2)}, median ${Number(median).toFixed(2)}). Listed at <strong>${Number(price).toFixed(2)}</strong> — slightly under median to sell faster.</>
        ) : (
          <>No comparable sold listings found — price is an estimate.</>
        )}
      </div>
      {open && rawComps.length > 0 && (
        <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 6 }}>
          {rawComps.slice(0, 10).map((c, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, fontFamily: 'JetBrains Mono, monospace', color: '#6b6b6b' }}>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 220 }}>{c.title || 'Sold item'}</span>
              <span style={{ color: '#1a1a1a', flexShrink: 0, marginLeft: 8 }}>${Number(c.sold_price || 0).toFixed(2)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function PoshmarkContent({ pm, price, comps, expanded, setExpanded }) {
  const earnings = (price * 0.80).toFixed(2);
  return (
    <>
      <FieldRow label="Title" value={pm.title || '—'} />

      <div style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center' }}>
          <FieldLabel>Description</FieldLabel>
          <CopyField value={pm.description} />
        </div>
        <div style={{
          fontSize: 13, color: '#6b6b6b', lineHeight: 1.5,
          display: '-webkit-box', WebkitBoxOrient: 'vertical',
          WebkitLineClamp: expanded ? 'unset' : 2, overflow: 'hidden',
        }}>{pm.description || ''}</div>
        <button onClick={() => setExpanded(e => !e)} style={{
          background: 'none', border: 'none', color: '#4f6ef7', fontSize: 13,
          cursor: 'pointer', marginTop: 4, padding: 0, fontFamily: 'Inter, sans-serif',
        }}>{expanded ? 'Show less ↑' : 'Show more →'}</button>
      </div>

      {pm.category && <FieldRow label="Category" value={pm.category} />}
      {pm.size && <FieldRow label="Size" value={pm.size} />}
      {pm.condition && <FieldRow label="Condition" value={pm.condition} />}
      {pm.brand && <FieldRow label="Brand" value={pm.brand} />}
      {pm.color && <FieldRow label="Color" value={pm.color} />}

      {pm.style_tags?.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <FieldLabel>Style Tags</FieldLabel>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {pm.style_tags.map(tag => (
              <span key={tag} style={{
                background: '#eff3ff', color: '#4f6ef7',
                fontSize: 12, padding: '3px 8px', borderRadius: 6,
                fontFamily: 'JetBrains Mono, monospace',
              }}>{tag}</span>
            ))}
          </div>
        </div>
      )}

      <PricingExplain comps={comps} price={price} />

      <div>
        <FieldLabel>Price &amp; Earnings</FieldLabel>
        <div style={{ fontSize: 13, color: '#6b6b6b', display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
          <span>Listing Price: <strong style={{ color: '#1a1a1a' }}>${price.toFixed(2)}</strong></span>
          <CopyField value={price.toFixed(2)} />
          <span style={{ color: '#c9c9c9' }}>→</span>
          <span>Your Earnings: <strong style={{ color: '#4f6ef7' }}>${earnings}</strong></span>
        </div>
      </div>
    </>
  );
}

function EbayContent({ eb, price, comps, expanded, setExpanded }) {
  const title = eb.title || '';
  const charCount = title.length;
  const specs = eb.item_specifics || {};
  const hasSpecs = Object.keys(specs).length > 0;
  return (
    <>
      <div style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center' }}>
          <FieldLabel>Title</FieldLabel>
          <CopyField value={title} />
        </div>
        <div style={{ fontSize: 14, fontWeight: 500, color: '#1a1a1a' }}>{title}</div>
        <div style={{
          fontFamily: 'JetBrains Mono, monospace', fontSize: 10, marginTop: 3,
          color: charCount > 70 ? '#c0392b' : '#9a9a9a',
        }}>{charCount}/80 characters</div>
      </div>

      {eb.category && <FieldRow label="Category" value={eb.category} />}
      {eb.condition && <FieldRow label="Condition" value={eb.condition} />}

      {hasSpecs && (
        <div style={{ marginBottom: 14 }}>
          <FieldLabel>Item Specifics</FieldLabel>
          <div style={{
            display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '7px 12px',
            background: '#fafafa', borderRadius: 8, padding: '10px 12px',
            border: '1px solid #f0f0f0',
          }}>
            {Object.entries(specs).map(([k, v]) => (
              <React.Fragment key={k}>
                <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: '#9a9a9a' }}>{k}</div>
                <div style={{ fontSize: 13, fontWeight: 500, color: '#1a1a1a', display: 'flex', alignItems: 'center' }}>
                  <span>{v}</span>
                  <CopyField value={v} />
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      )}

      <div style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center' }}>
          <FieldLabel>Description</FieldLabel>
          <CopyField value={eb.description} />
        </div>
        <div style={{
          fontSize: 13, color: '#6b6b6b', lineHeight: 1.5,
          display: '-webkit-box', WebkitBoxOrient: 'vertical',
          WebkitLineClamp: expanded ? 'unset' : 2, overflow: 'hidden',
        }}>{eb.description || ''}</div>
        <button onClick={() => setExpanded(e => !e)} style={{
          background: 'none', border: 'none', color: '#4f6ef7', fontSize: 13,
          cursor: 'pointer', marginTop: 4, padding: 0, fontFamily: 'Inter, sans-serif',
        }}>{expanded ? 'Show less ↑' : 'Show more →'}</button>
      </div>

      <PricingExplain comps={comps} price={price} />

      <div>
        <FieldLabel>Format &amp; Price</FieldLabel>
        <div style={{ fontSize: 14, fontWeight: 500, color: '#1a1a1a', display: 'flex', alignItems: 'center' }}>
          <span>Buy It Now · <span style={{ color: '#4f6ef7' }}>${price.toFixed(2)}</span></span>
          <CopyField value={price.toFixed(2)} />
        </div>
      </div>
    </>
  );
}

function ListingCard({ listing, jobId, itemIndex }) {
  const [platform, setPlatform] = useState('ebay');
  const [expanded, setExpanded] = useState(false);
  const [ebayPost, setEbayPost] = useState({ status: 'idle', listingUrl: null, error: null });

  const pm = listing.poshmark || {};
  const eb = listing.ebay || {};
  const meta = listing.metadata || {};
  const price = Number(listing.comps?.suggested_price || pm.price || eb.price || 0);

  const title = eb.title || pm.title || 'Item';
  const condition = meta.condition || pm.condition || '—';

  // No "copy full listing" blob — Poshmark and eBay's own forms use separate
  // fields (title, category, condition, description, price, etc.), so every
  // field below has its own copy button instead of one concatenated paste.

  // Live eBay posting is disabled in this public demo — it requires an admin
  // API key that can't safely be shipped in client-side JS. The real
  // POST /admin/post-to-ebay endpoint (with idempotency + rate limiting) is
  // exercised separately, outside this demo.

  return (
    <div style={{ borderRadius: 14, border: '1px solid #e7e7e7', background: '#ffffff', overflow: 'hidden' }}>

      {/* Header */}
      <div style={{ padding: 16, borderBottom: '1px solid #e7e7e7', display: 'flex', alignItems: 'center', gap: 12 }}>
        {listing.imageUrl ? (
          <img src={listing.imageUrl} alt="" style={{ width: 50, height: 50, borderRadius: 8, objectFit: 'cover', flexShrink: 0 }} />
        ) : (
          <HatchBox size={50} label="" />
        )}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: '#1a1a1a', marginBottom: 4, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{title}</div>
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 4,
            fontFamily: 'JetBrains Mono, monospace', fontSize: 10,
            letterSpacing: '0.5px',
            padding: '4px 8px', borderRadius: 999, border: '1px solid #e7e7e7',
            color: '#6b6b6b',
          }}><span style={{ textTransform: 'uppercase', color: '#9a9a9a' }}>Condition:</span> <span style={{ textTransform: 'capitalize' }}>{condition}</span></div>
        </div>
        <div style={{ fontSize: 22, fontWeight: 700, color: '#4f6ef7', flexShrink: 0 }}>${price.toFixed(2)}</div>
      </div>

      {/* Platform toggle */}
      <div style={{ padding: '12px 16px', borderBottom: '1px solid #e7e7e7', display: 'flex', gap: 8 }}>
        {['ebay', 'poshmark'].map(p => (
          <button
            key={p}
            onClick={() => { setPlatform(p); setExpanded(false); }}
            style={{
              height: 30, padding: '0 14px', borderRadius: 999, border: 'none',
              background: platform === p ? '#1a1a1a' : '#eff3ff',
              color: platform === p ? '#ffffff' : '#4f6ef7',
              fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'Inter, sans-serif',
              transition: 'background 0.15s, color 0.15s',
            }}
          >
            {p === 'poshmark' ? 'Poshmark' : 'eBay'}
          </button>
        ))}
      </div>

      {/* Listing content */}
      <div style={{ padding: 16, borderBottom: '1px solid #e7e7e7' }}>
        {platform === 'poshmark'
          ? <PoshmarkContent pm={pm} price={price} comps={listing.comps} expanded={expanded} setExpanded={setExpanded} />
          : <EbayContent eb={eb} price={price} comps={listing.comps} expanded={expanded} setExpanded={setExpanded} />
        }
      </div>

      {/* Post to eBay — disabled in public demo (requires admin API key) */}
      {platform === 'ebay' && (
        <div style={{ padding: '12px 16px', borderBottom: '1px solid #e7e7e7' }}>
          <button
            disabled
            title="Live posting uses an authenticated admin endpoint, disabled here for public demo safety"
            style={{
              width: '100%', height: 44, borderRadius: 10, border: 'none',
              background: '#ececec', color: '#9a9a9a',
              fontSize: 14, fontWeight: 500, cursor: 'not-allowed',
              fontFamily: 'Inter, sans-serif',
            }}
          >Post to eBay (demo mode)</button>
        </div>
      )}

      <div style={{ padding: '10px 16px 14px', textAlign: 'center' }}>
        <span style={{ fontSize: 11, color: '#9a9a9a', fontFamily: 'JetBrains Mono, monospace' }}>
          Tap the ⧉ icon next to any field to copy it
        </span>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════ */
function App() {
  const [screen, setScreen] = useState('upload');
  const [selectedFiles, setSelectedFiles] = useState([]);
  const [previewUrls, setPreviewUrls] = useState([]);
  const [jobId, setJobId] = useState('');
  const [jobData, setJobData] = useState(null);

  function handleAnalyze(files) {
    setSelectedFiles(files);
    setPreviewUrls(files.map(f => URL.createObjectURL(f)));
    setScreen('processing');
  }

  function handleDone(id, data) {
    setJobId(id);
    setJobData(data);
    setScreen('results');
  }

  function handleReset() {
    previewUrls.forEach(url => URL.revokeObjectURL(url));
    setSelectedFiles([]);
    setPreviewUrls([]);
    setJobId('');
    setJobData(null);
    setScreen('upload');
  }

  return (
    <>
      {screen === 'upload' && <UploadScreen onAnalyze={handleAnalyze} />}
      {screen === 'processing' && <ProcessingScreen files={selectedFiles} onDone={handleDone} />}
      {screen === 'results' && jobData && <ResultsScreen jobId={jobId} jobData={jobData} previewUrls={previewUrls} onReset={handleReset} />}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
