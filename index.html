<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flipr</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #F2F0EB;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 0;
  }

  #root {
    width: 390px;
    min-height: 100vh;
    background: #F2F0EB;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  @keyframes flipr-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #8A8378;
  }

  /* ─── Perforated hangtag edge — signature element shared by the landing
     card and result cards. Small manila-colored notches punched along the
     card's top edge, as if bitten out of a swing tag. ─── */
  .tag-notch { position: relative; }
  .tag-notch::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background-image: repeating-radial-gradient(circle at 12px 0, #F2F0EB 0 5px, transparent 5px 6px);
    background-size: 24px 8px;
    background-repeat: repeat-x;
    pointer-events: none;
  }

  ::-webkit-scrollbar { width: 0; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const API_BASE = "https://bvl98eh3bf.execute-api.us-east-1.amazonaws.com/dev";

/* ─── Price-tag palette — shared across every screen ─── */
const COLORS = {
  manila: '#F2F0EB',
  ink: '#1C1A17',
  tagRed: '#B8342A',
  receiptGreen: '#3D5A3C',
  graphite: '#8A8378',
};

/* ─── Scan history (localStorage, single-browser, no auth) ─── */
function getJobHistory() {
  const raw = localStorage.getItem('flipr_history');
  if (raw === null) return [];
  return JSON.parse(raw);
}

function saveJobToHistory(entry) {
  const history = getJobHistory();
  history.push(entry);
  localStorage.setItem('flipr_history', JSON.stringify(history));
}

function formatRelativeTime(timestamp) {
  const sec = Math.floor((Date.now() - timestamp) / 1000);
  if (sec < 60) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min} minute${min === 1 ? '' : 's'} ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} hour${hr === 1 ? '' : 's'} ago`;
  const day = Math.floor(hr / 24);
  if (day < 7) return `${day} day${day === 1 ? '' : 's'} ago`;
  const week = Math.floor(day / 7);
  if (week < 5) return `${week} week${week === 1 ? '' : 's'} ago`;
  const month = Math.floor(day / 30);
  if (month < 12) return `${month} month${month === 1 ? '' : 's'} ago`;
  const year = Math.floor(day / 365);
  return `${year} year${year === 1 ? '' : 's'} ago`;
}

// Same suggested-price fallback chain ListingCard uses, applied across a
// whole batch's items to get a price range for the History row.
function getPriceRange(items) {
  const prices = items
    .map(item => {
      const pm = item.result.listings.find(l => l.platform === 'poshmark') || {};
      const eb = item.result.listings.find(l => l.platform === 'ebay') || {};
      return Number(item.result.comps?.suggested_price || pm.price || eb.price || 0);
    })
    .filter(p => p > 0);
  if (prices.length === 0) return null;
  return { low: Math.min(...prices), high: Math.max(...prices) };
}

/* ─── Clipboard helper — navigator.clipboard requires HTTPS, so fall back
   to the legacy execCommand trick when running on plain HTTP (e.g. S3
   static website hosting has no TLS by default) ─── */
function copyToClipboard(text) {
  if (window.isSecureContext && navigator.clipboard) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try {
      const el = document.createElement('textarea');
      el.value = text;
      el.style.position = 'fixed';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.focus();
      el.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(el);
      ok ? resolve() : reject(new Error('copy failed'));
    } catch (err) {
      reject(err);
    }
  });
}

/* ─── Small per-field copy button ─── */
function CopyField({ value, small }) {
  const [done, setDone] = useState(false);
  if (!value) return null;
  return (
    <button
      onClick={(e) => {
        e.stopPropagation();
        copyToClipboard(String(value)).catch(() => {});
        setDone(true);
        setTimeout(() => setDone(false), 1200);
      }}
      title="Copy this field"
      style={{
        border: 'none', background: 'none', cursor: 'pointer', padding: 2,
        display: 'inline-flex', alignItems: 'center', marginLeft: 6,
        color: done ? COLORS.receiptGreen : COLORS.graphite, flexShrink: 0,

    >
      {done ? (
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
      ) : (
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M3 10.5V3.5C3 2.67157 3.67157 2 4.5 2H10.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
      )}
    </button>
  );
}

/* ─── Shared top bar ─── */
function TopBar() {

    <div style={{ paddingTop: 56, paddingLeft: 20, paddingRight: 20, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
      <span style={{ fontFamily: "'Archivo Condensed', sans-serif", fontWeight: 700, fontSize: 22, letterSpacing: '0.5px', color: COLORS.ink, textTransform: 'uppercase' }}>
        Flipr<span style={{ color: COLORS.tagRed }}>.</span>
      </span>
      <div style={{
        width: 32, height: 32, borderRadius: '50%', background: COLORS.ink,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: COLORS.manila, letterSpacing: '0.4px'

    </div>

}

/* ─── Hatched placeholder box ─── */
function HatchBox({ size, label }) {
  const id = `hatch-${size}-${label}`;
  return (
    <svg width={size} height={size} style={{ borderRadius: 8, flexShrink: 0 }}>
      <defs>
        <pattern id={id} patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#D8D3C7" strokeWidth="1" strokeDasharray="3 3" />
        </pattern>
      </defs>
      <rect width={size} height={size} fill={`url(#${id})`} rx="8" />
      {label && (
        <text x={size/2} y={size/2 + 3} textAnchor="middle" fontFamily="JetBrains Mono, monospace" fontSize="9" fill="#8A8378" letterSpacing="0.5">{label}</text>
      )}
    </svg>
  );
}

/* ══════════════════════════════════════════
   SCREEN 1: UPLOAD
══════════════════════════════════════════ */
function UploadScreen({ onAnalyze }) {
  const [files, setFiles] = useState([]);
  const [previews, setPreviews] = useState([]);
  const inputRef = useRef(null);

  useEffect(() => {
    return () => previews.forEach(url => URL.revokeObjectURL(url));
  }, []);

  function handleFileChange(e) {
    const incoming = Array.from(e.target.files);
    const newUrls = incoming.map(f => URL.createObjectURL(f));
    setFiles(prev => [...prev, ...incoming].slice(0, 5));
    setPreviews(prev => [...prev, ...newUrls].slice(0, 5));
    e.target.value = '';
  }

  function removeFile(i) {
    URL.revokeObjectURL(previews[i]);
    setFiles(prev => prev.filter((_, idx) => idx !== i));
    setPreviews(prev => prev.filter((_, idx) => idx !== i));
  }

  const hasFiles = files.length > 0;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
      <TopBar />
      <input
        ref={inputRef}
        type="file"
        multiple
        accept="image/*"
        style={{ display: 'none' }}
        onChange={handleFileChange}
      />

      {/* Title */}
      <div style={{ padding: '12px 20px 20px' }}>
        <div style={{ fontFamily: "'Archivo Condensed', sans-serif", fontWeight: 700, fontSize: 30, letterSpacing: '0.2px', color: COLORS.ink }}>New batch</div>
        <div style={{ fontSize: 14, color: COLORS.graphite, marginTop: 6 }}>Add up to 5 photos. We'll handle the rest.</div>
      </div>

      {/* Upload zone */}
      <div style={{ margin: '0 20px' }}>
        <div
          onClick={!hasFiles ? () => inputRef.current.click() : undefined}
          style={hasFiles ? {
            width: '100%',
            borderRadius: 14,
            border: 'none',
            background: '#ffffff',
            cursor: 'default',
          } : {
            position: 'relative',
            width: '100%',
            paddingTop: '100%',
            borderRadius: 14,
            border: '1.5px dashed #C9C2B2',
            background: 'repeating-linear-gradient(135deg, transparent 0 10px, rgba(28,26,23,0.03) 10px 11px)',
            cursor: 'pointer',
            overflow: 'hidden',
          }}
        >
          <div style={hasFiles ? {} : { position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
            {!hasFiles ? (
              <>
                <div style={{
                  width: 52, height: 52, borderRadius: '50%', background: '#ffffff',
                  border: '1px solid #E4DFD3', display: 'flex', alignItems: 'center', justifyContent: 'center'
                }}>
                  <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                    <path d="M11 14V4M11 4L7 8M11 4L15 8" stroke={COLORS.ink} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M4 16v1a2 2 0 002 2h10a2 2 0 002-2v-1" stroke={COLORS.graphite} strokeWidth="1.6" strokeLinecap="round"/>
                  </svg>
                </div>
                <div style={{ fontSize: 15, fontWeight: 500, color: COLORS.ink, marginTop: 14 }}>Tap to upload photo</div>
                <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: COLORS.graphite, marginTop: 4 }}>JPG · PNG · HEIC</div>
              </>
            ) : (
              <div style={{
                width: '100%',
                display: 'grid',
                gridTemplateColumns: '1fr 1fr',
                gap: 8,
                padding: 12,
              }}>
                {previews.map((url, i) => (
                  <div key={i} style={{
                    position: 'relative',
                    borderRadius: 10,
                    paddingTop: '100%',
                    overflow: 'hidden',
                  }}>
                    <img src={url} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} alt="" />
                    <button
                      onClick={e => { e.stopPropagation(); removeFile(i); }}
                      style={{
                        position: 'absolute', top: 5, right: 5,
                        width: 20, height: 20, borderRadius: '50%',
                        background: 'rgba(0,0,0,0.6)', border: 'none',
                        color: '#fff', fontSize: 13, lineHeight: 1,
                        cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontFamily: 'Inter, sans-serif',
                      }}
                    >×</button>
                  </div>
                ))}
                {files.length < 5 && (
                  <div
                    onClick={() => inputRef.current.click()}
                    style={{
                      position: 'relative',
                      paddingTop: '100%',
                      background: '#F2F0EB',
                      border: '1.5px dashed #C9C2B2',
                      borderRadius: 10,
                      cursor: 'pointer',
                    }}
                  >
                    <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 4 }}>
                      <span style={{ fontSize: 22, color: COLORS.graphite, lineHeight: 1 }}>+</span>
                      <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 10, color: COLORS.graphite }}>add</span>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Counter */}
      {hasFiles && (
        <div style={{ marginTop: 12, marginLeft: 20, marginRight: 20 }}>
          <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: COLORS.graphite }}>
            {files.length} of 5 photos added
          </span>
        </div>
      )}

      <div style={{ flex: 1 }} />

      {/* Bottom dock */}
      <div style={{ padding: '12px 20px 48px', borderTop: '1px solid #E4DFD3' }}>
        <button
          onClick={() => hasFiles && onAnalyze(files)}
          disabled={!hasFiles}
          style={{
            width: '100%', height: 52, borderRadius: 12, border: 'none',
            background: hasFiles ? COLORS.ink : '#E4DFD3',
            color: hasFiles ? COLORS.manila : COLORS.graphite,
            fontSize: 15, fontWeight: 600, cursor: hasFiles ? 'pointer' : 'not-allowed',
            fontFamily: 'Inter, sans-serif', letterSpacing: '-0.2px',
            transition: 'background 0.2s, color 0.2s',
          }}
        >
          Analyze Items →
        </button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   SCREEN 2: PROCESSING
══════════════════════════════════════════ */
const MAX_LONG_EDGE_PX = 2000;
const MAX_UPLOAD_BYTES = 3 * 1024 * 1024; // under the worker's 3.5 MiB guard
const UNREADABLE_PHOTO_MSG = "We couldn't read this photo. Try a JPEG, or take a screenshot of it and upload that.";

// Decode, cap the long edge (never upscale), and re-encode as JPEG so Bedrock
// only ever receives a JPEG under its size limit.
async function resizeToJpeg(file) {
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    throw new Error(UNREADABLE_PHOTO_MSG);
  }
  const scale = Math.min(1, MAX_LONG_EDGE_PX / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  if (bitmap.close) bitmap.close();
  for (const quality of [0.85, 0.7, 0.55]) {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
    if (blob && blob.size <= MAX_UPLOAD_BYTES) return blob;
  }
  throw new Error(UNREADABLE_PHOTO_MSG);
}

function ProcessingScreen({ files, onDone, onRetry }) {
  const [phase, setPhase] = useState('uploading'); // 'uploading' | 'analyzing'
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;

    // Poll a single Lambda job (POST /jobs -> upload -> GET /jobs/{id}) until complete/failed
    async function runOneJob(rawFile) {
      // Resize first so an unreadable photo never creates a job or uploads.
      const file = await resizeToJpeg(rawFile);
      const createRes = await fetch(`${API_BASE}/jobs`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ marketplace: 'ebay' }),
      });
      if (!createRes.ok) throw new Error(`create job ${createRes.status}: ${await createRes.text()}`);
      const { job_id, upload_url } = await createRes.json();

      const uploadRes = await fetch(upload_url, {
        method: 'PUT',
        headers: { 'Content-Type': 'image/jpeg' },
        body: file,
      });
      if (!uploadRes.ok) throw new Error(`upload ${uploadRes.status}`);

      while (!cancelled) {
        await new Promise(r => setTimeout(r, 2000));
        if (cancelled) return null;
        const statusRes = await fetch(`${API_BASE}/jobs/${job_id}`);
        if (!statusRes.ok) throw new Error(`jobs ${statusRes.status}`);
        const data = await statusRes.json();
        if (data.status === 'complete') return { job_id, ...data };
        if (data.status === 'failed') throw new Error(data.error || 'Job failed');
      }
      return null;
    }

    async function run() {
      try {
        // Lambda's /jobs endpoint processes one image per job, so run each
        // uploaded photo as its own job, in parallel, then combine results.
        const results = await Promise.all(files.map(runOneJob));
        if (cancelled) return;
        setPhase('analyzing');
        if (cancelled) return;

        const combined = {
          status: 'completed',
          items: results.filter(Boolean).map(r => ({
            job_id: r.job_id,
            result: {
              metadata: r.metadata,
              comps: r.comps,
              listings: r.listings,
            },
          })),
        };
        onDone(results[0]?.job_id || '', combined);
      } catch (err) {
        if (!cancelled) setError(err.message);
      }
    }

    run();
    return () => { cancelled = true; };
  }, []);

  if (error) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
        <TopBar />
        <div style={{ padding: '12px 20px 20px' }}>
          <div style={{ fontFamily: "'Archivo Condensed', sans-serif", fontWeight: 700, fontSize: 30, letterSpacing: '0.2px', color: COLORS.ink }}>Something went wrong</div>
          <div style={{ fontSize: 14, color: COLORS.tagRed, marginTop: 6, fontFamily: 'JetBrains Mono, monospace' }}>{error}</div>
        </div>
        <div style={{ padding: '0 20px' }}>
          <button
            onClick={onRetry}
            style={{
              height: 48, padding: '0 20px', borderRadius: 12, border: 'none',
              background: COLORS.ink, color: COLORS.manila,
              fontSize: 15, fontWeight: 600, cursor: 'pointer', fontFamily: 'Inter, sans-serif',
            }}
          >Try again</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
      <TopBar />
      <div style={{ padding: '12px 20px 20px' }}>
        <div style={{ fontFamily: "'Archivo Condensed', sans-serif", fontWeight: 700, fontSize: 30, letterSpacing: '0.2px', color: COLORS.ink }}>
          {phase === 'uploading' ? 'Uploading photos…' : 'Analyzing your items…'}
        </div>
        <div style={{ fontSize: 14, color: COLORS.graphite, marginTop: 6 }}>Usually takes 10–20 seconds</div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 1, paddingBottom: 80 }}>
        <div style={{
          width: 40, height: 40, borderRadius: '50%',
          border: '3px solid #E4DFD3', borderTopColor: COLORS.tagRed,
          animation: 'flipr-spin 0.8s linear infinite',
        }} />
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   SCREEN 3: RESULTS
══════════════════════════════════════════ */
function ResultsScreen({ jobId, jobData, previewUrls, onNewBatch, onBackHome }) {
  const listings = jobData.items.map((item, index) => ({
    itemIndex: index,
    jobId: item.job_id,
    imageUrl: previewUrls[index],
    metadata: item.result.metadata,
    comps: item.result.comps,
    poshmark: item.result.listings.find(l => l.platform === "poshmark"),
    ebay: item.result.listings.find(l => l.platform === "ebay"),
  }));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
      <TopBar />

      <div style={{ padding: '12px 20px 20px' }}>
        <div style={{ fontFamily: "'Archivo Condensed', sans-serif", fontWeight: 700, fontSize: 30, letterSpacing: '0.2px', color: COLORS.ink }}>{listings.length} listings ready</div>
        <div style={{ fontSize: 14, color: COLORS.graphite, marginTop: 6 }}>Tap copy to use a listing</div>
      </div>

      {/* Scrollable listing cards */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '0 20px 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
        {listings.map((listing) => (
          <ListingCard key={listing.itemIndex} listing={listing} jobId={listing.jobId} itemIndex={listing.itemIndex} />
        ))}
      </div>

      {/* Bottom dock */}
      <div style={{ padding: '12px 20px 48px', borderTop: '1px solid #E4DFD3', flexShrink: 0, display: 'flex', gap: 10 }}>
        <button
          onClick={onBackHome}
          style={{
            flex: 1, height: 44, borderRadius: 10, border: `1px solid ${COLORS.ink}33`,
            background: '#ffffff', color: COLORS.ink,
            fontSize: 14, fontWeight: 500, cursor: 'pointer', fontFamily: 'Inter, sans-serif',
          }}
        >
          ← Home
        </button>
        <button
          onClick={onNewBatch}
          style={{
            flex: 1, height: 44, borderRadius: 10, border: 'none',
            background: COLORS.ink, color: COLORS.manila,
            fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: 'Inter, sans-serif',
          }}
        >
          New batch →
        </button>
      </div>
    </div>
  );
}

/* ─── Listing card sub-components ─── */
function FieldLabel({ children }) {
  return (
    <div style={{
      fontFamily: 'JetBrains Mono, monospace', fontSize: 11,
      textTransform: 'uppercase', letterSpacing: '0.8px',
      color: COLORS.graphite, marginBottom: 5,
    }}>{children}</div>
  );
}

function FieldRow({ label, value }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <FieldLabel>{label}</FieldLabel>
      <div style={{ fontSize: 14, fontWeight: 500, color: COLORS.ink, display: 'flex', alignItems: 'center' }}>
        <span>{value}</span>
        <CopyField value={value} />
      </div>
    </div>
  );
}

function PoshmarkContent({ pm, fields, setFields, cardState, comps, expanded, setExpanded, inputStyle, monoInputStyle }) {
  const editing = cardState === 'editing';
  const poshPrice = fields.poshmark.price;
  const earnings = (poshPrice >= 15 ? poshPrice * 0.80 : poshPrice - 2.95).toFixed(2);
  return (
    <>
      {editing ? (
        <div style={{ marginBottom: 14 }}>
          <FieldLabel>Title</FieldLabel>
          <input
            value={fields.poshmark.title}
            onChange={e => setFields(f => ({ ...f, poshmark: { ...f.poshmark, title: e.target.value } }))}
            style={inputStyle}
          />
        </div>
      ) : (
        <FieldRow label="Title" value={fields.poshmark.title || '—'} />
      )}

      <div style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center' }}>
          <FieldLabel>Description</FieldLabel>
          {!editing && <CopyField value={fields.poshmark.description} />}
        </div>
        {editing ? (

function ListingCard({ listing, jobId, itemIndex }) {
  const [platform, setPlatform] = useState('ebay');
  const [expanded, setExpanded] = useState(false);
  const [cardState, setCardState] = useState('view'); // 'view' | 'editing' | 'confirmed'

  const pm = listing.poshmark || {};
  const eb = listing.ebay || {};
  const meta = listing.metadata || {};

  // Local, per-card copy of the editable fields — seeded once from the
  // pipeline output, then mutated only by this card's own inputs. Price is
  // per-platform: Poshmark is seeded 10% above the eBay comp price as a
  // disclosed heuristic (Poshmark buyers commonly negotiate/make offers),
  // not scraped Poshmark data.
  const [fields, setFields] = useState(() => {
    const basePrice = Number(listing.comps?.suggested_price || pm.price || eb.price || 0);
    return {
      ebay: {
        price: basePrice,
        title: eb.title || '',
        description: eb.description || '',
        specifics: { ...(eb.item_specifics || {}) },
      },
      poshmark: {
        price: Math.round(basePrice * 1.10 * 100) / 100,
        title: pm.title || '',
        description: pm.description || '',
      },
    };
  });

  const title = fields.ebay.title || fields.poshmark.title || 'Item';
  const condition = meta.condition || pm.condition || '—';
  const headerPrice = platform === 'poshmark' ? fields.poshmark.price : fields.ebay.price;

  const inputStyle = {
    width: '100%', border: `1px solid ${COLORS.ink}33`, borderRadius: 6,
    padding: '6px 8px', fontSize: 14, color: COLORS.ink,
    fontFamily: 'Inter, sans-serif', background: '#ffffff',
  };
  const monoInputStyle = { ...inputStyle, fontFamily: 'JetBrains Mono, monospace' };

  function toggleEdit() {
    // view -> editing, editing -> view, confirmed -> editing
    setCardState(s => (s === 'editing' ? 'view' : 'editing'));
  }

  // No "copy full listing" blob — Poshmark and eBay's own forms use separate
  // fields (title, category, condition, description, price, etc.), so every
  // field below has its own copy button instead of one concatenated paste.

  // Live eBay posting is disabled in this public demo — it requires an admin
  // API key that can't safely be shipped in client-side JS. The real
  // POST /admin/post-to-ebay endpoint (with idempotency + rate limiting) is
  // exercised separately, outside this demo.

  return (
    <div className="tag-notch" style={{ borderRadius: 14, border: `1px solid ${COLORS.ink}1a`, background: '#ffffff', overflow: 'hidden' }}>

      {/* Header */}
      <div style={{ padding: '20px 16px 16px', borderBottom: '1px solid #E4DFD3', display: 'flex', alignItems: 'center', gap: 12 }}>
        {listing.imageUrl ? (

          <HatchBox size={50} label="" />
        )}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.ink, marginBottom: 4, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{title}</div>
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 4,
            fontFamily: 'JetBrains Mono, monospace', fontSize: 10,
            letterSpacing: '0.5px',
            padding: '4px 8px', borderRadius: 999, border: '1px solid #E4DFD3',
            color: COLORS.graphite,
          }}><span style={{ textTransform: 'uppercase', color: COLORS.graphite }}>Condition:</span> <span style={{ textTransform: 'capitalize' }}>{condition}</span></div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4, flexShrink: 0 }}>
          {cardState === 'confirmed' && (
            <span style={{
              fontFamily: 'JetBrains Mono, monospace', fontSize: 9, fontWeight: 600,
              textTransform: 'uppercase', letterSpacing: '0.5px',
              color: COLORS.receiptGreen, background: '#E3EBE2',
              padding: '2px 6px', borderRadius: 999,
            }}>Reviewed ✓</span>
          )}
          <div className="mono" style={{ fontSize: 22, fontWeight: 700, color: COLORS.tagRed }}>${headerPrice.toFixed(2)}</div>
        </div>
      </div>

      {/* Platform toggle */}
      <div style={{ padding: '12px 16px', borderBottom: '1px solid #E4DFD3', display: 'flex', gap: 8 }}>
        {['ebay', 'poshmark'].map(p => (
          <button
            key={p}
            onClick={() => { setPlatform(p); setExpanded(false); }}
            style={{
              height: 30, padding: '0 14px', borderRadius: 999, border: 'none',
              background: platform === p ? COLORS.ink : '#F5E6E4',
              color: platform === p ? COLORS.manila : COLORS.tagRed,
              fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'Inter, sans-serif',
              transition: 'background 0.15s, color 0.15s',
            }}
          >
            {p === 'poshmark' ? 'Poshmark' : 'eBay'}

        ))}
      </div>

      {/* Listing content */}
      <div style={{ padding: 16, borderBottom: '1px solid #E4DFD3' }}>
        {platform === 'poshmark'
          ? <PoshmarkContent pm={pm} fields={fields} setFields={setFields} cardState={cardState} comps={listing.comps} expanded={expanded} setExpanded={setExpanded} inputStyle={inputStyle} monoInputStyle={monoInputStyle} />

          {cardState === 'editing' ? 'Done' : 'Edit'}

        {cardState === 'confirmed' ? (
          <button

          <button

      <div style={{ padding: '10px 16px 14px', textAlign: 'center' }}>
        <span style={{ fontSize: 11, color: COLORS.graphite, fontFamily: 'JetBrains Mono, monospace' }}>
          Tap the ⧉ icon next to any field to copy it
        </span>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════ */
function App() {
  const [screen, setScreen] = useState('home');
  const [selectedFiles, setSelectedFiles] = useState([]);
  const [previewUrls, setPreviewUrls] = useState([]);
  const [jobId, setJobId] = useState('');
  const [jobData, setJobData] = useState(null);

  function handleAnalyze(files) {
    setSelectedFiles(files);
    setPreviewUrls(files.map(f => URL.createObjectURL(f)));
    setScreen('processing');
  }

  function handleDone(id, data) {
    setJobId(id);
    setJobData(data);
    // previewUrls are blob: URLs tied to this session — not revoked below so
    // History thumbnails for this batch stay valid until the tab closes.
    saveJobToHistory({
      jobId: id,
      timestamp: Date.now(),
      previewUrls: previewUrls,
      items: data.items,
    });
    setScreen('results');
  }

  function handleSelectHistoryEntry(entry) {
    setJobId(entry.jobId);
    setJobData({ status: 'completed', items: entry.items });
    setPreviewUrls(entry.previewUrls);
    setScreen('results');
  }

  function handleNewBatch() {
    setSelectedFiles([]);
    setPreviewUrls([]);
    setJobId('');
    setJobData(null);
    setScreen('upload');
  }

  return (
    <>
      {screen === 'home' && <HomeScreen onStartBatch={() => setScreen('upload')} onViewHistory={() => setScreen('history')} />}
      {screen === 'upload' && <UploadScreen onAnalyze={handleAnalyze} />}
      {screen === 'processing' && <ProcessingScreen files={selectedFiles} onDone={handleDone} onRetry={() => setScreen('upload')} />}
      {screen === 'results' && jobData && (
        <ResultsScreen jobId={jobId} jobData={jobData} previewUrls={previewUrls} onNewBatch={handleNewBatch} onBackHome={() => setScreen('home')} />
      )}
      {screen === 'history' && <HistoryScreen onSelect={handleSelectHistoryEntry} onStartBatch={() => setScreen('upload')} onBack={() => setScreen('home')} />}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
